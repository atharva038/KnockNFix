name: CI Smoke Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    name: Validation And Auth Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation smoke suite
        run: npm run smoke:validation

      - name: Run auth smoke suite
        run: npm run smoke:auth
